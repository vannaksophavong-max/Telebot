<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Voice Generator</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'tts_app/css/style.css' %}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta
      name="description"
      content="A minimal, modern local text-to-speech web application using edge-tts."
    />
  </head>
  <body class="dark-mode">
    <div class="app-container">
      <header>
        <div class="logo">
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path
              d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"
            ></path>
          </svg>
          <h1>Vocaly</h1>
        </div>
        <button
          id="theme-toggle"
          class="icon-button"
          aria-label="Toggle Dark Mode"
        >
          <svg
            class="sun-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="display: none"
          >
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg
            class="moon-icon"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </header>

      <main class="main-content">
        <form id="tts-form">
          {% csrf_token %}
          <div class="input-group">
            <label for="text-input">Text to Speech</label>
            <div class="textarea-wrapper">
              <textarea
                id="text-input"
                name="text"
                placeholder="Type or paste your text here..."
                required
              ></textarea>
              <div class="char-count">
                <span id="char-current">0</span> characters
              </div>
            </div>
          </div>

          <div class="controls-grid">
                    <div class="control-group">
                        <label for="voice-select">Voice</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <select id="voice-select" name="voice" style="flex: 1;">
                                <optgroup label="English (US)">
                                    <option value="en-US-AriaNeural">Aria (Female, Natural)</option>
                                    <option value="en-US-GuyNeural">Guy (Male, Deep)</option>
                                    <option value="en-US-JennyNeural">Jenny (Female, Friendly)</option>
                                    <option value="en-US-ChristopherNeural">Christopher (Male, Formal)</option>
                                </optgroup>
                                <optgroup label="English (UK)">
                                    <option value="en-GB-SoniaNeural">Sonia (Female)</option>
                                    <option value="en-GB-RyanNeural">Ryan (Male)</option>
                                </optgroup>
                                <optgroup label="English (Australia)">
                                    <option value="en-AU-NatashaNeural">Natasha (Female)</option>
                                    <option value="en-AU-WilliamNeural">William (Male)</option>
                                </optgroup>
                            </select>
                            <button type="button" id="preview-btn" class="icon-button" aria-label="Preview Voice" style="background: var(--border-color); border-radius: 0.5rem; padding: 0.75rem;" title="Preview this voice">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                            </button>
                        </div>
                    </div>

            <div class="control-group">
              <label for="speed-select">Speed</label>
              <select id="speed-select" name="speed">
                <option value="slow">Slow (-20%)</option>
                <option value="normal" selected>Normal</option>
                <option value="fast">Fast (+20%)</option>
              </select>
            </div>
          </div>

          <div class="actions">
            <button type="submit" id="generate-btn" class="primary-btn">
              <span class="btn-text">Generate Voice</span>
              <div class="spinner" style="display: none"></div>
            </button>
          </div>
        </form>

        <div id="error-message" class="alert error" style="display: none"></div>

        <div
          id="player-container"
          class="player-container glass-panel"
          style="display: none"
        >
          <h3>Generated Audio</h3>
          <audio id="audio-player" controls preload="auto"></audio>
          <div class="player-actions">
            <a id="download-btn" href="#" download class="secondary-btn">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              Download Audio
            </a>
          </div>
        </div>

        <div class="history-section">
          <h3>Recent Generations</h3>
          <ul id="history-list" class="history-list">
            <!-- History items will go here -->
          </ul>
        </div>
      </main>
    </div>

    <script src="{% static 'tts_app/js/script.js' %}"></script>
  </body>
</html>
